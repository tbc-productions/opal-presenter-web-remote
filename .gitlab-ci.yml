image: $CI_REGISTRY/openlp/runners/angular

stages:
  - test
  - build
  - deploy

audit:
  stage: test
  script: |
    pnpm install
    pnpm audit
  rules:
    - when: always
  allow_failure: true

lint:
  stage: test
  script: |
    pnpm install
    pnpm lint
  rules:
    - when: always

test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.0-jammy
  script: |
    export NVM_DIR="$HOME/.nvm"
    mkdir -p $NVM_DIR
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.6/install.sh | bash
    [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    nvm install 22
    nvm alias default
    nvm use default
    npm install -g pnpm
    pnpm install
    npx playwright install chromium-headless-shell
    pnpm test
  rules:
    - when: always

push-i18n-source:
  stage: build
  script: |
    pnpm install axios
    pnpm install @transifex/api
    pnpm run tx push
  rules:
    - changes:
        - src/assets/en.json

build:
  stage: build
  script: |
    pnpm install
    pnpm build --no-progress --configuration production --aot
    if [ "$CI_COMMIT_TAG" != "" ]; then
      APP_VERSION="${CI_COMMIT_TAG}"
    else
      APP_VERSION=`git describe --dirty --tags --long --match '*[0-9]*'`
    fi
    echo "window.appVersion = \"$APP_VERSION\";" > dist/web-remote/assets/version.js
    # TODO: Remove this workaround for the media folder when OpenLP 4 has been released and
    # add requirement for minimum Web API version 2.7 to Web Remote.
    mv dist/web-remote/media dist/web-remote/assets
    sed --in-place 's|"./media/|"./assets/media/|g' dist/web-remote/styles-*.css
  artifacts:
    paths:
      - dist/

deploy:
  stage: deploy
  variables:
    OPENLP_HOST: "new.openlp.io"
  script: |
    cd dist/web-remote
    zip -r ../../remote-$CI_COMMIT_TAG.zip *
    cd ../../
    export CHECK_SUM=`sha256sum remote-$CI_COMMIT_TAG.zip | cut -d' ' -f1`
    export FILE_SIZE=`stat -c '%s' remote-$CI_COMMIT_TAG.zip`
    echo -e "{\"latest\": {\"version\": \"$CI_COMMIT_TAG\", \"sha256\": \"$CHECK_SUM\", \"filename\": \"remote-$CI_COMMIT_TAG.zip\", \"size\": $FILE_SIZE}}" > version-$CI_COMMIT_TAG.json
    mkdir -p ~/.ssh
    echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    chmod 600 ~/.ssh/id_rsa
    eval $(ssh-agent -s)
    ssh-add ~/.ssh/id_rsa
    [[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    ssh openlp@$OPENLP_HOST "mkdir -p /home/openlp/sites/get.openlp.org/www/remote/$CI_COMMIT_TAG"
    scp remote-$CI_COMMIT_TAG.zip openlp@$OPENLP_HOST:/home/openlp/sites/get.openlp.org/www/remote/$CI_COMMIT_TAG/
    scp version-$CI_COMMIT_TAG.json openlp@$OPENLP_HOST:/home/openlp/sites/get.openlp.org/www/remote/
    ssh openlp@$OPENLP_HOST "rm /home/openlp/sites/get.openlp.org/www/remote/version.json"
    scp version-$CI_COMMIT_TAG.json openlp@$OPENLP_HOST:/home/openlp/sites/get.openlp.org/www/remote/version.json
  rules:
    - if: $CI_COMMIT_TAG
